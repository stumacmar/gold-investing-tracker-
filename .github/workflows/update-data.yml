name: Update gold signal data

on:
  schedule:
    # Twice daily on weekdays: after London open and after New York close (UTC)
    - cron: "0 7 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install xlrd

      - name: Fetch data and compute score
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u scripts/fetch_and_score.py

      - name: Commit updated data
        run: |
          git config user.name "gold-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          SCORE=$(python -c "import json; d=json.load(open('data/latest.json')); print(f\"{d['score']} {d['verdict']}\")")
          git commit -m "data: $SCORE ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Retry push in case a concurrent run or manual commit landed first
          for i in 1 2 3 4; do
            git push && exit 0
            echo "Push failed, rebasing and retrying ($i)..."
            git pull --rebase
            sleep $((2 ** i))
          done
          git push
